name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APKs
        working-directory: android
        run: gradle --no-daemon assemblePublicCloudDebug assembleLanDebug
      - uses: actions/upload-artifact@v4
        with:
          name: arca-drive-android-debug
          path: |
            android/app/build/outputs/apk/publicCloud/debug/app-publicCloud-debug.apk
            android/app/build/outputs/apk/lan/debug/app-lan-debug.apk
          if-no-files-found: error
          retention-days: 30
