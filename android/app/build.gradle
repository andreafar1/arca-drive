plugins { id 'com.android.application' }

android {
    namespace 'it.arcadrive.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'it.arcadrive.mobile'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildFeatures { buildConfig true }
    flavorDimensions += 'connection'
    productFlavors {
        publicCloud {
            dimension 'connection'
            buildConfigField 'boolean', 'ALLOW_LOCAL_HTTP', 'false'
        }
        lan {
            dimension 'connection'
            applicationIdSuffix '.lan'
            versionNameSuffix '-lan'
            buildConfigField 'boolean', 'ALLOW_LOCAL_HTTP', 'true'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.work:work-runtime:2.11.2'
}
