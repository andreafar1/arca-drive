services:
  db:
    image: postgres:17.11-bookworm
    container_name: arca-drive-db
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arca_drive}
      POSTGRES_USER: ${POSTGRES_USER:-arca_drive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Imposta POSTGRES_PASSWORD nel file .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arca_drive} -d ${POSTGRES_DB:-arca_drive}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - arca_internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arca-drive
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-arca_drive}
      PGUSER: ${POSTGRES_USER:-arca_drive}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Imposta JWT_SECRET nel file .env}
      STORAGE_DIR: /data/files
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-200}
      MAX_UPLOAD_CHUNK_MB: ${MAX_UPLOAD_CHUNK_MB:-10}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      REQUIRE_HTTPS: ${REQUIRE_HTTPS:-false}
      COLLABORA_INTERNAL_URL: http://collabora:9980
      COLLABORA_PUBLIC_URL: ${COLLABORA_PUBLIC_URL:-}
      WOPI_INTERNAL_URL: http://app:3000
    volumes:
      - file_data:/data/files
    ports:
      - "${ARCA_DRIVE_PORT:-8080}:3000"
    security_opt:
      - no-new-privileges:true
    networks:
      - arca_internal

  collabora:
    image: collabora/code:latest
    container_name: arca-drive-collabora
    restart: unless-stopped
    environment:
      aliasgroup1: http://app:3000
      extra_params: --o:ssl.enable=false --o:ssl.termination=false --o:net.frame_ancestors=*
      dictionaries: it_IT en_US
    cap_add:
      - MKNOD
    ports:
      - "${COLLABORA_PORT:-9980}:9980"
    networks:
      - arca_internal

volumes:
  postgres_data:
  file_data:

networks:
  arca_internal:
    driver: bridge
